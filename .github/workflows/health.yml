name: Catalog health

# Re-verifies listed releases through the GitHub API (release still published,
# GitHub's asset digest still equal to the recorded sha256, icon reachable),
# without downloading any artifact. Each day checks one seventh of the catalog,
# so every record is checked once a week and API use stays low. Also reports
# newer upstream releases and stale reservations.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      slice:
        description: Which records to check
        type: choice
        options: [today, all]
        default: today

permissions:
  contents: read

jobs:
  health:
    name: Re-verify records
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python3 -m catalog health --slice "$SLICE"
        env:
          SLICE: ${{ inputs.slice || 'today' }}
          GITHUB_TOKEN: ${{ github.token }}
